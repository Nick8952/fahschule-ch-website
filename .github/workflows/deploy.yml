# Baut den Next.js-Static-Export und veröffentlicht ihn auf GitHub Pages.
# Läuft nach jedem Push auf main (auch CMS-Commits).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Betrieb unter der eigenen GitHub-Pages-URL (kein DNS nötig):
      #   https://nick8952.github.io/fahschule-ch_demo/
      # Beim Go-Live auf eine eigene Domain: public/CNAME anlegen, Custom Domain in
      # Settings->Pages setzen, dann SITE_ORIGIN=https://<domain> und BASE_PATH="" (siehe HANDOVER.md 6).
      SITE_ORIGIN: https://nick8952.github.io
      BASE_PATH: /fahschule-ch_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
