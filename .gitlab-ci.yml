# GitLab Pages – Spiegel-Deploy (primär ist GitHub Pages, siehe .github/workflows/deploy.yml).
# Hält den bestehenden Demo-Link fahrschule-ch-website-f63075.gitlab.io am Leben.
# Läuft nach jedem Push auf den Default-Branch (auch CMS-Commits).

image: node:22-alpine

variables:
  SITE_ORIGIN: "https://fahrschule-ch-website-f63075.gitlab.io"
  BASE_PATH: ""

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
