# GitLab Pages – baut den Next.js-Static-Export und veröffentlicht ihn.
# Nach jedem Push auf den Default-Branch (auch CMS-Commits) läuft dieser Job.

image: node:22-alpine

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
